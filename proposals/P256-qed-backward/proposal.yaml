id: P256
schema_version: 2
base_release: v0.183.0
source_baseline: substrate-framework@14e0b08f6099698b6d117840e65f86cbe70d4efb
canonical_issue: '222'
campaign_type: discovery
target_kind: mechanism_selection
question: >-
  Which deeper constructions can supply the coupled quantum electron-photon
  structures responsible for Compton scattering and complementary QED observables?
positive_objective: >-
  Explain the interacting electron-photon sector by working backward from QED
  observables, preserving quantum states, spin/statistics, propagation, gauge-current
  identities, Lorentz limits and quantitative parameter obligations on joined maps.
  This first artifact is a worked reference and tested conditional construction,
  not fulfillment of the full physical objective.
owner_resumption: >-
  Direct user instruction resumes research and reiterates observable-first backward
  reasoning; the GitHub issue's pause text is stale, not a scientific result.
coordination_boundary: >-
  Marvin owns integration and publication. Three workers own disjoint reference,
  constraint and quantum-supplier files. Independent review is evidence, not merge,
  scientific claim-promotion or issue-closure authority.
invariants:
  - QED is the explanandum; importing its quantum algebra or action does not explain it.
  - Metric (+---), hbar=c=1; q_e=-e; numerical reference m=e=1 unless explicitly rescaled.
  - One charge fixes covariant propagation, current and photon vertices on a given map.
  - Photon gauge equivalence and physical polarizations are not classical-wave identity.
  - Grassmann spin variables or a Dirac band do not alone derive fermionic exchange.
  - Matching Thomson alone does not establish the finite-energy or spin-dependent sector.
  - No single-Euler or neutrino requirements inherited from retired issue 203.
allowed_imports:
  - Established tree QED as a reference calculation, with m and e supplied.
  - Complex Hilbert spaces, quantum canonical algebras and Fock states, explicitly conditional.
  - Clifford/CAR and link gauge structures as declared supplier inputs, not derived ontology.
  - Weak-field noncompact photon quadratic sector; compact Coulomb-phase transfer remains open.
candidates:
  - id: graded-constraint
    description: >-
      Conditional graded constraint closure binds minimal covariant propagation to
      magnetic response; investigate what it explains versus merely reencodes.
  - id: quantum-link
    description: >-
      Quantum gauge-constrained rotor/link network supplies charge-current compatibility
      and a two-transverse-mode weak-field sector; statistics and Dirac matter are separate debts.
  - id: joined-wilson-link
    description: >-
      Join declared CAR/Clifford charged bands and quantum photon link variables at
      the actual Compton kernel, deriving vertices/contact from the same hopping law.
  - id: two-link-repair
    description: >-
      Cancel the nearest Wilson band's soft inertial/rest-mass mismatch using
      gauge-covariant two-link mass paths while retaining heavy doubler corners.
  - id: broader-suppliers
    description: >-
      Euler, independent microrotation, constrained spin/rotor and other constructions
      remain available when the backward obligations justify their selection.
uniqueness_evidence: null
selection_criteria:
  - Derive required relationships from the observable before selecting suppliers.
  - Reject concrete wrong maps using both Ward directions and spin/polarization-resolved kernels.
  - Distinguish soft normalization, finite-energy shape, exchange statistics and Lorentz limits.
  - Track imported, fitted, derived and unresolved inputs; minimize rather than hide debt.
claims_proposed: []
comparators_blinded_until: >-
  None: standard QED, Klein-Nishina, Thomson and lattice identities were known during
  construction. These are transparent consistency and discriminating calculations,
  not blinded discoveries or independent parameter predictions.
candidate_universe:
  scope: >-
    Nonexclusive suppliers of issue 222's target-derived quantum electron-photon
    obligations; no root fixed in advance and no exhaustion claim.
  frozen_from:
    - Issue 222 interacting QED objective and first Compton benchmark.
    - Direct user authorization and repeated backward-reasoning instruction.
    - Reference external states, pole residues, current identities and quantum statistics.
  route_families:
    - Coupled algebraic/constraint interfaces.
    - Quantum gauge-constrained networks and effective continuum maps.
    - Target-derived continuum/media or other microscopic suppliers.
  append_only_expansions:
    - Wilson curvature mismatch motivates covariant two-link repair, not speed tuning alone.
