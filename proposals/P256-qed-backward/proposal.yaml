campaign_type: discovery
target_kind: mechanism_selection
question: >-
  Which deeper constructions can supply the coupled quantum electron-photon
  structures responsible for Compton scattering and complementary QED observables?
positive_objective: >-
  Explain the interacting electron-photon sector by working backward from QED
  observables, preserving quantum states, spin/statistics, propagation, gauge-current
  identities, Lorentz limits and quantitative parameter obligations on joined maps.
  Build and iteratively strengthen constructive theorems: energetic bosonic
  statistics/spin selection, matter-dressed photons and a shared scattering consumer.
owner_resumption: >-
  Direct user instruction resumes research and reiterates observable-first backward
  reasoning; the GitHub issue's pause text is stale, not a scientific result.
coordination_boundary: >-
  Marvin owns integration and publication; independent workers own disjoint
  theorem and physical-consumer slices. Review improves exact constructions
  without conferring merge or issue-closure authority.
invariants:
  - QED is the explanandum; importing its quantum algebra or action does not explain it.
  - Metric (+---), hbar=c=1; q_e=-e; numerical reference m=e=1 unless explicitly rescaled.
  - One charge fixes covariant propagation, current and photon vertices on a given map.
  - Photon gauge equivalence and physical polarizations are not classical-wave identity.
  - Grassmann spin variables or a Dirac band do not alone derive fermionic exchange.
  - Matching Thomson alone does not establish the finite-energy or spin-dependent sector.
  - No single-Euler or neutrino requirements inherited from retired issue 203.
allowed_imports:
  - Established tree QED as a reference calculation, with m and e supplied.
  - Complex Hilbert spaces, quantum canonical algebras and Fock states, explicitly conditional.
  - Primitive bosonic Pauli tensor-product law and quantum dynamics as the microscopic starting point.
  - Compact rotor quantum law and scalar hopping/elastic coefficients, with explicit effective maps.
  - Gaussian photon plus quadratic sea-response approximation, improved by coupled feedback.
candidates:
