  - id: quantum-compact-spinor
    description: >-
      Actual Pauli/Gauss four-orbital compact Hamiltonian yields charged multiplets,
      creator residues and positive same-H photon response without factorized states.
  - id: quantum-orbital-mass
    description: >-
      Pure-quartic positive bosonic amplitude couples to the actual matter law;
      occupied energy induces its distribution and a quantum charged-energy gap.
  - id: general-compact-photon-neutrality
    description: >-
      General torus ground positivity gives the neutral photon comparison;
      exact finite-Fourier counterexamples motivate a positivity-preserving regulator.
  - id: quantum-geometric-mass
    description: >-
      Spin-scalar compact U1 Wilson positivity and a global parallel sea frame
      give infinite-loop quantum mass beyond the sufficient heavy-hopping bound.
  - id: analytic-photon-infrared
    description: >-
      Exact zero-transfer electric/magnetic coefficients of the primitive sea
      determine the actual infrared photon speed and same-current soft charge.
  - id: interacting-quantum-current
    description: >-
      Actual complete Gauss domains and compact-photon resolvents give nonforward
      matter-source response with same-H contact and longitudinal cancellation.
  - id: quantum-adjoint-mass
    description: >-
      Entire fifteen-coordinate zero-preferring quantum adjoint coupling gives
      a certified one-cell charge gap; its multiplets are not selected Dirac states.
  - id: local-orbital-gauge
    description: >-
      Changed local SU4 adjoint-Higgs law supplies positive fifteen-direction bare
      curvatures; full quantum Gauss, shapes and three-dimensional phase are separate.
  - id: heavy-neutral-orbital-join
    description: >-
      EM-neutral heavy occupied sea stiffens a shared zero-origin orbital saddle
      with finite light feedback and returns to the same photon/scattering consumer.
      Global mean filling does not project the hopping sea onto local centre neutrality.
  - id: gauged-rotation-localization
    description: >-
      Derived Z4 lift cocycle and actual residual Gauss fibre realize a conditional
      charge-localization class; complete pure-gauge rotation is still identity.
  - id: exact-haar-photon-charge
    description: >-
      exact_haar_alignment.md supplies continuous multiplication before projection;
      quantum_su4_photon_aligned_receipt.json executes Jpref=.2,R=2 with coefficient
      Lambda*Jpref/8 and m=.2,r=.12,v=.3. gauss_photon_charge.md and its verified
