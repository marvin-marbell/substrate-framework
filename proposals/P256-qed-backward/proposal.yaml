      coefficients; scoped review accepts Gauss/current/derivative identities,
      not a full-field ground, selected Dirac sector or phase.
  - id: same-bare-full-coordinate-packet
    description: >-
      full_band_packet_bound.md and source-bound receipts give a normalized
      120-field/Haar/two-phase Gauss packet at the photon bare coefficients.
      Cartesian field kinetic replaces selected-orbit inertia. With field
      support radius .006 the certified upper C*Lambda+T*sqrt(Lambda)+B has
      C=-.42619579165 and is negative above Lambda=6.18313862825e16.
      This is a variational energy and invariant-amplitude consequence,
      not a full-field ground, Clifford phase, charged lower gap or half-spin.
  - id: static-sea-colour-backreaction
    description: >-
      su4_sea_backreaction.md and midpoint/split_gauss receipts execute all45 uniform
      colour Hessian directions. The repaired coupling-unit control compares rebuilt
      g-squared-normalized sea/bare matrices and raw generalized spectra, not merely
      clipped Jcritical=0. Static uniform stability is not Gauss projection or
      quantum/nonlinear phase selection.
  - id: broader-suppliers
    description: >-
      Euler, independent microrotation, constrained spin/rotor and other constructions
      remain available when the backward obligations justify their selection.
uniqueness_evidence: null
selection_criteria:
  - Derive required relationships from the observable before selecting suppliers.
  - Reject concrete wrong maps using both Ward directions and spin/polarization-resolved kernels.
  - Distinguish soft normalization, finite-energy shape, exchange statistics and Lorentz limits.
  - Track imported, fitted, derived and unresolved inputs; minimize rather than hide debt.
claims_proposed: []
comparators_blinded_until: >-
  None: standard QED, Klein-Nishina, Thomson and lattice identities were known during
  construction. These are transparent consistency and discriminating calculations,
  not blinded discoveries or independent parameter predictions.
candidate_universe:
  scope: >-
    Nonexclusive suppliers of issue 222's target-derived quantum electron-photon
    obligations; no root fixed in advance and no exhaustion claim.
  frozen_from:
    - Issue 222 interacting QED objective and first Compton benchmark.
    - Direct user authorization and repeated backward-reasoning instruction.
    - Reference external states, pole residues, current identities and quantum statistics.
  route_families:
    - Coupled algebraic/constraint interfaces.
    - Quantum gauge-constrained networks and effective continuum maps.
    - Target-derived continuum/media or other microscopic suppliers.
  append_only_expansions:
    - Wilson curvature mismatch motivates covariant two-link repair, not speed tuning alone.
    - Exact Haar multiplication adds nonzero alignment to the same compact Gauss-photon and primitive charge consumer.
    - A full-field charge upper motivates covariant paired and full occupied-band Gauss trials without claiming a charged lower gap.
    - A zero clipped sea threshold motivates raw-spectrum and g-squared matrix unit controls rather than a vacuous threshold comparison.
