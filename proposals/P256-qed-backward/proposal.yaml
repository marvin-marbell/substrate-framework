      positive_intent: Work backward from a normalized QED Compton reference and its dependencies.
      requires: []
      pass_licenses: [reference-compton]
      does_not_license: [deeper-origin]
      maximum_verdict: Reference calculation with imported QED structures and parameters.
      failure_scope: Formula, normalization, chosen kinematics or implementation.
      unlocks: [joined-interface]
      status: active
      license_chain:
        object: Tree e-minus gamma scattering on on-shell external reference states.
        symmetry_or_conservation: Incoming/outgoing Ward identities, charge-current compatibility.
        ensemble: Fixed incoming electron/photon and resolved or averaged spin/polarization.
        variational_functional: Reference QED Lagrangian, not claimed as explained root.
        admissible_space: Perturbative asymptotic reference states, fixed nonzero energy, tree order.
        representation_coverage: Two photon polarizations, two electron spins, both pole channels.
        observable: Compton amplitude, Klein-Nishina differential cross section and Thomson limit.
        numerical_representation: Explicit gamma/spinor matrices versus analytic comparator and adverse channels.
        permitted_verdict: Validated reference, not microscopic mechanism.
    - id: joined-interface
      positive_intent: Construct propagation-current-contact-state maps at the actual scattering consumer.
      requires: [reference-compton]
      pass_licenses: [conditional-joined-kernel]
      does_not_license: [deeper-origin]
      maximum_verdict: Conditional quantum-link construction with declared imported algebra and parameters.
      failure_scope: Candidate band, link path, normalization, representation or low-momentum regime.
      unlocks: [origin]
      status: active
      license_chain:
        object: Continuous-time gauge-covariant Wilson-link and two-link charged bands.
        symmetry_or_conservation: Discrete Ward differences and Gauss-compatible coupling.
        ensemble: Tree one-electron one-photon scattering with full internal band resolvent.
        variational_functional: Canonical quantum Hamiltonian with same-link hopping expansion.
        admissible_space: Low Brillouin-zone branch, imported CAR, Clifford and quantum photon states.
        representation_coverage: Both intermediate signs, transverse photon modes and required contact.
        observable: Matrix kernel, soft inertial mass, finite-energy rate and finite-scale orientation corrections.
        numerical_representation: Exact finite matrices, energy root, spacing refinement and omitted-contact falsifier.
        permitted_verdict: Conditional interface; no electron/photon origin or finite-scale experimental claim.
    - id: origin
      positive_intent: Replace imported structures with explanatory suppliers without breaking the joined target.
      requires: [conditional-joined-kernel]
      pass_licenses: [deeper-origin]
      does_not_license: []
      maximum_verdict: Joined quantum interacting sector only if every issue obligation is actually supplied.
      failure_scope: A specified supplier/map/regime, never every possible deeper theory.
      unlocks: []
      status: active
      license_chain:
        object: Deeper laws and interfaces supplying issue 222 physical state and interaction content.
        symmetry_or_conservation: Must preserve reference identities through justified effective maps.
        ensemble: Quantum charged and photon states including interacting-state interpretation.
        variational_functional: Unassigned beyond explicit attempted supplier laws; unresolved, not zero.
        admissible_space: Supplier-specific domains must be justified rather than assumed universal.
        representation_coverage: Photon helicities, charged spin/statistics, propagation and response together.
        observable: Compton plus complementary spin, exchange and renormalized observables.
        numerical_representation: No complete microscopic construction claimed; partial probes remain partial.
        permitted_verdict: Open explanatory obligation until checked full joined outcome.
