      .9645065263. Independent matched-parent ground Ritz comparisons are finite-domain
      evidence, not a global ground proof from source-initialized k=1, a full-field
      phase, a 3D photon or a scattering S matrix.
  - id: unrestricted-covariant-gauss-trials
    description: >-
      full_field_charge_bound.md and default/improved receipts supply a boundary-average
      charge-cost upper for positive boundary density, both C0=88.75958333333335;
